<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Brain Tumor Detection AI</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;

    background:#f4f6f9;
}

.container{
    width:100%;
    max-width:550px;

    background:#ffffff;

    border-radius:20px;

    padding:35px;

    text-align:center;

    box-shadow:
    0 8px 25px rgba(0,0,0,0.08);

    border:1px solid #e5e7eb;
}

.logo{
    font-size:70px;
    margin-bottom:10px;
}

h1{
    color:#1f2937;
    margin-bottom:10px;
}

.subtitle{
    color:#6b7280;
    margin-bottom:25px;
    line-height:1.6;
}

.upload-box{
    background:#f9fafb;

    border:2px dashed #d1d5db;

    border-radius:15px;

    padding:20px;

    margin-bottom:20px;
}

input[type=file]{
    width:100%;
    cursor:pointer;
}

.preview-container{
    margin-top:20px;
}

#preview{
    width:100%;
    max-height:350px;
    object-fit:contain;

    border-radius:15px;

    border:3px solid rgba(255,255,255,0.5);

    display:none;
}

button{
    width:100%;
    padding:15px;

    border:none;
    border-radius:12px;

    background:#2563eb;

    color:white;

    font-size:17px;
    font-weight:600;

    cursor:pointer;

    transition:0.3s;
}

button:hover{
    background:#1d4ed8;
}

button:hover{

    transform:translateY(-3px);

    box-shadow:
    0 10px 20px rgba(0,0,0,0.3);
}

button:active{
    transform:scale(0.98);
}

.loader{

    display:none;

    width:55px;
    height:55px;

    margin:25px auto;

    border:5px solid rgba(255,255,255,0.3);

    border-top:5px solid white;

    border-radius:50%;

    animation:spin 1s linear infinite;
}

#result{
    margin-top:20px;
    font-size:22px;
    font-weight:600;
    color:#111827;
}

.footer{

    margin-top:25px;

    color:#dbeafe;

    font-size:14px;
}

@keyframes spin{

    100%{
        transform:rotate(360deg);
    }
}

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(25px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

</style>
</head>

<body>

<div class="container">

    

    <h1>Brain Tumor Detection </h1>

    <p class="subtitle">
        Upload an MRI brain scan image.
    </p>

    <div class="upload-box">
        <input
        type="file"
        id="imageInput"
        accept="image/*">
    </div>

    <div class="preview-container">
        <img id="preview">
    </div>

    <button onclick="predict()">
        Analyze MRI Scan
    </button>

    <div class="loader" id="loader"></div>

    <div id="result"></div>


</div>

<script>

const imageInput =
document.getElementById("imageInput");

const preview =
document.getElementById("preview");

imageInput.addEventListener(
"change",
function(){

    const file = this.files[0];

    if(file){

        preview.src =
        URL.createObjectURL(file);

        preview.style.display =
        "block";
    }
}
);

async function predict(){

    const file =
    imageInput.files[0];

    if(!file){

        alert(
        "Please upload an MRI image first."
        );

        return;
    }

    const formData =
    new FormData();

    formData.append(
    "image",
    file
    );

    document.getElementById(
    "loader"
    ).style.display="block";

    document.getElementById(
    "result"
    ).innerHTML="";

    try{

        const response =
        await fetch(
        "/predict",
        {
            method:"POST",
            body:formData
        });

        const data =
        await response.json();

        document.getElementById(
        "loader"
        ).style.display="none";

        if(data.prediction==="Tumor"){
            document.getElementById("result").innerHTML =
            " Tumor Detected";
        }
        else{
            document.getElementById("result").innerHTML =
            " No Tumor Detected";
        }

    }
    catch(error){

        document.getElementById(
        "loader"
        ).style.display="none";

        document.getElementById(
        "result"
        ).innerHTML=

        "❌ Server Error";

        console.error(error);
    }
}

</script>

</body>
</html>
